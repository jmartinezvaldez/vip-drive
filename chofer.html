<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chofer</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-zinc-950 text-white p-4"><div class="max-w-md mx-auto">
<h1 class="text-2xl font-black">CHOFER VIPDRIVE</h1><p id="choferId" class="text-yellow-400"></p><div id="lista" class="mt-6 space-y-3">Cargando...</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDfpRv7mrAkTyETSYqmOTebVHokrbP_o2M", authDomain: "vip-drive-f19c1.firebaseapp.com", projectId: "vip-drive-f19c1", storageBucket: "vip-drive-f19c1.firebasestorage.app", messagingSenderId: "696888361898", appId: "1:696888361898:web:789595b0782015384521d3" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const miId = new URLSearchParams(location.search).get('id')||'chofer1';
document.getElementById('choferId').innerText=miId;
const q = query(collection(db, "viajes"), orderBy("fecha","desc"));
onSnapshot(q, (snap)=>{
  const viajes = snap.docs.filter(d=> d.data().estado==='buscando');
  document.getElementById('lista').innerHTML = viajes.length===0 ? '<p class=text-gray-500>No hay solicitudes</p>' : viajes.map(d=>{
    const v=d.data();
    return `<div class="bg-zinc-900 p-4 rounded-2xl"><p class="font-bold">${v.cliente} -> ${v.destino}</p><p class="text-xs text-gray-400">${v.telefono||''}</p><div class="flex gap-2 mt-3"><a href="https://wa.me/52${v.telefono}?text=Hola ${v.cliente}" class="flex-1 bg-green-500 text-black text-center py-3 rounded-xl font-black">WhatsApp</a><button data-id="${d.id}" class="tomar flex-1 bg-yellow-400 text-black py-3 rounded-xl font-black">TOMAR</button></div></div>`;
  }).join('');
  document.querySelectorAll('.tomar').forEach(b=> b.onclick=async()=>{ await updateDoc(doc(db, "viajes", b.dataset.id), {estado:'tomado por '+miId, chofer:miId}); });
});
</script></body></html>
