<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chofer Real Time</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>#map{height:55vh}</style></head>
<body class="bg-black text-white"><div class="max-w-md mx-auto"><div id="map"></div><div class="p-4">
<p class="font-black">ID: <span id="miId" class="text-purple-400"></span> - GPS EN VIVO</p><p id="estado" class="text-xs text-green-400">Moviendo carrito en tiempo real...</p>
<div id="alerta" class="hidden bg-yellow-400 text-black rounded-2xl p-4 mt-3"><p class="font-black">🔔 VIAJE 10 SEG</p><p id="alert-cliente"></p><p id="alert-tarifa" class="font-black"></p><div class="flex gap-2 mt-2"><button id="btn-aceptar" class="flex-1 bg-black text-white py-3 rounded-xl font-black">ACEPTAR</button><button id="btn-rechazar" class="flex-1 bg-white text-black py-3 rounded-xl">RECHAZAR</button></div></div>
<button id="activar" class="w-full mt-3 bg-purple-600 py-4 rounded-full font-black">ACTIVAR GPS TIEMPO REAL (2 SEG)</button>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDfpRv7mrAkTyETSYqmOTebVHokrbP_o2M", authDomain: "vip-drive-f19c1.firebaseapp.com", projectId: "vip-drive-f19c1", storageBucket: "vip-drive-f19c1.firebasestorage.app", messagingSenderId: "696888361898", appId: "1:696888361898:web:789595b0782015384521d3" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const miId = new URLSearchParams(location.search).get('id')||'6691234567'; document.getElementById('miId').innerText=miId;
let map=L.map('map').setView([23.2329,-106.4062],14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let myMarker=null, viajeActual=null;
async function activar(){
  const d=await getDoc(doc(db,"choferes",miId)); if(!d.exists()){ document.getElementById('estado').innerText='❌ No registrado'; return; }
  document.getElementById('estado').innerText='✅ '+d.data().nombre+' transmitiendo cada 2 seg';
  // GPS cada 2 segundos + heading para rotar carrito
  navigator.geolocation.watchPosition(async pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude, heading=pos.coords.heading||0, speed=pos.coords.speed||0;
    map.setView([lat,lng],15); if(myMarker) map.removeLayer(myMarker); myMarker=L.marker([lat,lng]).addTo(map);
    await setDoc(doc(db,"choferes",miId),{lat,lng,heading,speed,disponible:viajeActual?false:true,lastUpdate:serverTimestamp(),online:true},{merge:true});
  }, null, {enableHighAccuracy:true, maximumAge:1000, timeout:5000});
  // También por intervalo por si watchPosition no dispara
  setInterval(async ()=>{
    navigator.geolocation.getCurrentPosition(async pos=>{
      await setDoc(doc(db,"choferes",miId),{lat:pos.coords.latitude,lng:pos.coords.longitude,lastUpdate:serverTimestamp(),online:true},{merge:true});
    });
  }, 2000);
}
document.getElementById('activar').onclick=activar; activar();
onSnapshot(query(collection(db,"viajes"), where("chofer_solicitado","==",miId), where("estado","==","solicitado_chofer")), snap=>{
  snap.forEach(docSnap=>{ viajeActual={id:docSnap.id, ...docSnap.data()}; document.getElementById('alerta').classList.remove('hidden'); document.getElementById('alert-cliente').innerText=docSnap.data().cliente; document.getElementById('alert-tarifa').innerText='$'+docSnap.data().tarifa_final; });
});
document.getElementById('btn-aceptar').onclick=async()=>{ if(viajeActual){ await updateDoc(doc(db,"viajes",viajeActual.id),{estado:'aceptado'}); document.getElementById('alerta').classList.add('hidden'); } };
document.getElementById('btn-rechazar').onclick=async()=>{ if(viajeActual){ await updateDoc(doc(db,"viajes",viajeActual.id),{estado:'rechazado'}); document.getElementById('alerta').classList.add('hidden'); viajeActual=null; } };
</script></body></html>
