<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chofer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-950 text-white p-4">
    <div class="max-w-md mx-auto">
        <h1 class="font-bold">CHOFER PANEL</h1>
        <p id="id" class="text-yellow-400 text-sm"></p>
        <div id="lista" class="mt-6 space-y-3"></div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        const firebaseConfig = { apiKey: "PEGÁ_AQUÍ_TU_APIKEY", authDomain: "PEGÁ_AQUÍ", projectId: "PEGÁ_AQUÍ" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const miId = new URLSearchParams(location.search).get('id') || 'chofer1';
        document.getElementById('id').innerText = miId;
        const q = query(collection(db, "viajes"), orderBy("fecha", "desc"));
        onSnapshot(q, (snap) => {
            document.getElementById('lista').innerHTML = snap.docs.map(d => {
                const v = d.data();
                return `<div class="bg-zinc-900 p-4 rounded-xl"><p class="font-bold">${v.cliente} -> ${v.destino}</p><p class="text-xs text-gray-400">${v.estado}</p><button data-id="${d.id}" class="tomar mt-3 w-full bg-yellow-400 text-black py-2 rounded-lg font-bold">Tomar (80% para ti)</button></div>`
            }).join('');
            document.querySelectorAll('.tomar').forEach(b => b.onclick = async () => {
                await updateDoc(doc(db, "viajes", b.dataset.id), { estado: 'tomado por ' + miId });
            });
        });
    </script>
</body>

</html>
