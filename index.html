<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VIPDRIVE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-4"><div class="max-w-md mx-auto">
<h1 class="text-4xl font-black text-yellow-400">VIPDRIVE</h1>
<div class="bg-zinc-900 rounded-3xl p-6 mt-6">
<input id="cliente" placeholder="Tu nombre" class="w-full p-4 rounded-xl bg-black border border-zinc-700">
<input id="destino" placeholder="¿A dónde vas?" class="w-full mt-3 p-4 rounded-xl bg-black border border-zinc-700">
<input id="tel" placeholder="WhatsApp 669..." class="w-full mt-3 p-4 rounded-xl bg-black border border-zinc-700">
<button id="btn" class="w-full mt-6 bg-yellow-400 text-black font-black py-4 rounded-xl">SOLICITAR</button>
<p id="status" class="mt-4 text-center text-sm"></p>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDfpRv7mrAkTyETSYqmOTebVHokrbP_o2M", authDomain: "vip-drive-f19c1.firebaseapp.com", projectId: "vip-drive-f19c1", storageBucket: "vip-drive-f19c1.firebasestorage.app", messagingSenderId: "696888361898", appId: "1:696888361898:web:789595b0782015384521d3" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
document.getElementById('btn').onclick = async () => {
 const cliente=document.getElementById('cliente').value, destino=document.getElementById('destino').value, tel=document.getElementById('tel').value;
 if(!cliente||!destino) return alert('Llena datos');
 document.getElementById('btn').innerText='Enviando...';
 await addDoc(collection(db, "viajes"), { cliente, destino, telefono: tel, estado:'buscando', fecha: serverTimestamp() });
 document.getElementById('status').innerText='✅ Solicitud enviada';
 document.getElementById('btn').innerText='SOLICITAR';
}
</script></body></html>
