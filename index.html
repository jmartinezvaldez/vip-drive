<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VIPDRIVE - Carritos Tiempo Real</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>#map{height:60vh} .car{transition: all 2s linear !important} .sheet{background:white;border-radius:28px 28px 0 0;padding:16px;color:black}</style></head>
<body><div class="p-2 bg-black text-white flex justify-between text-xs fixed top-0 left-0 right-0 z-[1000]"><b>VIPDRIVE</b><span id="count">0 choferes moviéndose</span><span id="live" class="text-green-400">● EN VIVO</span></div><div id="map" style="margin-top:32px"></div><div class="sheet"><p class="font-black text-sm">🚗 Carritos moviéndose en tiempo real - Toca uno</p><p id="status" class="text-xs text-gray-500"></p></div>
<div id="modal" class="hidden fixed inset-0 bg-black/70 z-[2000] flex items-end"><div class="bg-white w-full rounded-t-[28px] p-5 max-w-md mx-auto"><div class="flex gap-3"><img id="m-foto" class="w-20 h-20 rounded-full object-cover border-4 border-purple-500"><div><p id="m-nombre" class="font-black text-lg text-black"></p><p id="m-auto" class="text-sm text-gray-600"></p><p id="m-dist" class="text-xs text-purple-600 font-bold"></p></div></div><div class="grid grid-cols-2 gap-2 mt-3"><img id="m-carro1" class="h-24 w-full object-cover rounded-xl"><img id="m-carro2" class="h-24 w-full object-cover rounded-xl"></div><button id="m-elegir" class="w-full mt-4 bg-black text-white py-4 rounded-full font-black">ELEGIR ESTE CHOFER</button><button id="m-cerrar" class="w-full mt-2 bg-gray-100 py-3 rounded-full text-xs">CERRAR</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDfpRv7mrAkTyETSYqmOTebVHokrbP_o2M", authDomain: "vip-drive-f19c1.firebaseapp.com", projectId: "vip-drive-f19c1", storageBucket: "vip-drive-f19c1.firebasestorage.app", messagingSenderId: "696888361898", appId: "1:696888361898:web:789595b0782015384521d3" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let map=L.map('map',{zoomControl:false}).setView([23.2329,-106.4111],14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let myLat=23.2329, myLng=-106.4111, carMarkers={}, choferSel=null;
navigator.geolocation.getCurrentPosition(p=>{ myLat=p.coords.latitude; myLng=p.coords.longitude; map.setView([myLat,myLng],15); L.marker([myLat,myLng]).addTo(map).bindPopup("Tú"); });
function dist(a,b,c,d){ const R=6371, dLat=(c-a)*Math.PI/180, dLon=(d-b)*Math.PI/180, e=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(e),Math.sqrt(1-e)); }
// TIEMPO REAL: cada vez que un chofer se mueve, mueve el carrito suave
onSnapshot(collection(db,"choferes"), snap=>{
  const activos=snap.docs.filter(d=>d.data().online!==false && d.data().lat); document.getElementById('count').innerText=activos.length+' choferes moviéndose';
  activos.forEach(doc=>{
    const c=doc.data(); const id=doc.id;
    const lat=c.lat, lng=c.lng, heading=c.heading||0;
    // Si ya existe, muévelo suave
    if(carMarkers[id]){
      carMarkers[id].setLatLng([lat,lng]);
      // Rotar carrito según dirección
      const el=carMarkers[id].getElement(); if(el){ el.style.transform=`rotate(${heading}deg)`; }
    } else {
      // Crear nuevo carrito
      const icon=L.divIcon({className:'car', html:`<div style="background:white;border:3px solid #8B5CF6;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.4);transform:rotate(${heading}deg)">🚗</div><div style="background:black;color:white;font-size:9px;font-weight:900;padding:2px 6px;border-radius:10px;text-align:center;margin-top:2px;white-space:nowrap">${c.nombre?c.nombre.split(' ')[0]:'Chofer'} • ${c.auto?c.auto.split(' ')[0]:''}</div>`, iconSize:[48,48], iconAnchor:[24,24]});
      const m=L.marker([lat,lng],{icon}).addTo(map);
      m.on('click', ()=>{
        choferSel={id, ...c};
        document.getElementById('m-foto').src=c.fotoChofer||c.foto||'https://i.pravatar.cc/150?u='+id;
        document.getElementById('m-carro1').src=c.fotoCarro||'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=400';
        document.getElementById('m-carro2').src=c.fotoCarro2||c.fotoCarro||'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=400';
        document.getElementById('m-nombre').innerText=c.nombre||'Chofer VIP'; document.getElementById('m-auto').innerText=`${c.auto||''} ${c.anio||''} • ${c.placas||''} • ${c.color||''}`; document.getElementById('m-dist').innerText=`A ${dist(myLat,myLng,lat,lng).toFixed(1)} km • Movíendose ahora`;
        document.getElementById('modal').classList.remove('hidden');
      });
      carMarkers[id]=m;
    }
    document.getElementById('status').innerText=`Última actualización: ${new Date().toLocaleTimeString()} - ${activos.length} carritos en vivo`;
  });
});
document.getElementById('m-cerrar').onclick=()=>document.getElementById('modal').classList.add('hidden');
document.getElementById('m-elegir').onclick=()=>{ document.getElementById('modal').classList.add('hidden'); alert(`Elegiste a ${choferSel.nombre} - Ahora te abre solicitud con 10 seg`); };
</script></body></html>
