<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIPDRIVE Mazatlán</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>#map{height:100vh;width:100%} .bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:white;border-radius:28px 28px 0 0;z-index:1000;padding:18px;max-height:75vh;overflow:auto} .car-label{font-size:10px;font-weight:900;background:black;color:white;padding:2px 6px;border-radius:10px}</style>
</head>
<body>
<div id="map"></div>
<button id="ubicar" class="fixed bottom-[340px] right-4 z-[1000] w-14 h-14 bg-white rounded-full shadow-xl">🎯</button>
<div class="fixed top-4 left-4 z-[1000] bg-black text-white px-4 py-2 rounded-full text-xs font-black">● <span id="count">0</span> CHOFERES EN MAPA</div>

<div id="modal-chofer" class="hidden fixed inset-0 bg-black/50 z-[2000] flex items-end">
<div class="bg-white w-full rounded-t-[28px] p-6 max-w-md mx-auto">
<button id="cerrar-modal" class="float-right w-8 h-8 bg-gray-100 rounded-full">X</button>
<div class="flex gap-4"><img id="m-foto" class="w-20 h-20 rounded-full border-4 border-purple-500 object-cover"><div><p id="m-nombre" class="font-black text-black text-lg"></p><p id="m-auto" class="text-sm text-gray-500"></p><p class="text-yellow-500 text-sm">⭐5.0 • Chofer verificado</p></div></div>
<div class="mt-4 bg-purple-50 rounded-xl p-3"><p id="m-dist" class="text-xs text-purple-600 font-bold"></p><p class="font-black text-black">$10/km • Mínimo $35</p></div>
<a id="m-wsp" target="_blank" class="block w-full mt-4 bg-green-500 text-white text-center py-4 rounded-full font-black">📱 ENVIAR VIAJE POR WHATSAPP</a>
<button id="m-solicitar-app" class="w-full mt-2 bg-black text-white py-3 rounded-full font-black">SOLICITAR EN APP</button>
</div>
</div>

<div class="bottom-sheet">
<div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-3"></div>
<h1 class="text-[20px] font-black text-black">¿A dónde vas, Pasajero?</h1>
<input id="origen" class="w-full mt-2 bg-gray-100 rounded-xl px-4 py-3 text-sm text-black" placeholder="📍 Tu ubicación - Mazatlán">
<div class="mt-2 bg-gray-100 rounded-2xl flex items-center px-4 py-3"><span>🔍</span><input id="destino" class="flex-1 bg-transparent outline-none ml-2 text-black font-bold" placeholder="Ej: Av. Camarón Sábalo 202, Cobaes 36, Plaza Acaya"><button id="clear" class="w-8 h-8 bg-gray-200 rounded-full text-xs">X</button></div>
<div class="mt-3 border-t pt-3">
<p class="text-xs font-black text-gray-500">DETALLE CON RUTA REAL POR CALLES</p>
<p class="text-sm text-black">Distancia: <b id="dist-real">-- km</b> • <span id="tiempo">--</span> • <span id="ruta-metros" class="text-purple-600"></span></p>
<p class="text-xl font-black text-black">Total: <b id="tarifa-final" class="text-purple-600">$35 mínimo</b></p>
<div class="flex gap-2 mt-2"><input id="nombre" placeholder="Tu nombre" class="flex-1 p-3 bg-gray-100 rounded-xl text-sm text-black"><input id="tel" placeholder="WhatsApp" class="flex-1 p-3 bg-gray-100 rounded-xl text-sm text-black"></div>
<button id="solicitar" class="w-full mt-3 bg-black text-white py-4 rounded-full font-black">CALCULAR RUTA REAL</button>
<p id="status" class="text-xs text-center mt-2 text-green-600 font-bold"></p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDfpRv7mrAkTyETSYqmOTebVHokrbP_o2M", authDomain: "vip-drive-f19c1.firebaseapp.com", projectId: "vip-drive-f19c1", storageBucket: "vip-drive-f19c1.firebasestorage.app", messagingSenderId: "696888361898", appId: "1:696888361898:web:789595b0782015384521d3" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let myLat=23.2329, myLng=-106.4111, destLat=null, destLng=null, map, myMarker, carMarkers={}, routeLine, distanciaReal=0, choferSeleccionado=null, choferesData={};
map = L.map('map', {zoomControl:false}).setView([myLat, myLng], 14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
function calcTarifa(km){ return Math.max(35, Math.round(km*10)); }
async function geocodeMazatlan(texto){
  const queries=[texto+" Mazatlán Sinaloa Mexico", texto+" Mazatlán", texto];
  for(let q of queries){ try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`); const d=await r.json(); if(d.length>0) return {lat:parseFloat(d[0].lat), lng:parseFloat(d[0].lon), display:d[0].display_name}; }catch(e){} }
  return null;
}
async function calcularRutaReal(){
  const t=document.getElementById('destino').value; if(!t || t.length<3) return null;
  document.getElementById('ruta-metros').innerText='Buscando dirección...';
  const geo=await geocodeMazatlan(t); if(!geo){ document.getElementById('ruta-metros').innerText='No encontrada, sé más específico'; return null; }
  destLat=geo.lat; destLng=geo.lng;
  try{ const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${myLng},${myLat};${destLng},${destLat}?overview=full&geometries=geojson`); const j=await r.json(); if(j.routes && j.routes[0]){ distanciaReal=j.routes[0].distance/1000; const coords=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]); if(routeLine) map.removeLayer(routeLine); routeLine=L.polyline(coords,{color:'#8B5CF6',weight:7}).addTo(map); map.fitBounds(routeLine.getBounds(),{padding:[80,80]}); document.getElementById('dist-real').innerText=distanciaReal.toFixed(2)+' km'; document.getElementById('tiempo').innerText=Math.round(j.routes[0].duration/60)+' min'; document.getElementById('ruta-metros').innerText=geo.display.split(',').slice(0,2).join(','); const tarifa=calcTarifa(distanciaReal); document.getElementById('tarifa-final').innerText='$'+tarifa+(distanciaReal*10<35?' (mín $35)':''); document.getElementById('solicitar').innerText=`SOLICITAR POR $${tarifa}`; return {km:distanciaReal, tarifa:tarifa, ruta:coords, dest:geo}; } }catch(e){}
  return null;
}
document.getElementById('destino').addEventListener('change', calcularRutaReal); document.getElementById('clear').onclick=()=>{ document.getElementById('destino').value=''; }; document.getElementById('ubicar').onclick=()=>{ navigator.geolocation.getCurrentPosition(p=>{ myLat=p.coords.latitude; myLng=p.coords.longitude; map.setView([myLat,myLng],15); }); };
navigator.geolocation.getCurrentPosition(p=>{ myLat=p.coords.latitude; myLng=p.coords.longitude; map.setView([myLat,myLng],14); myMarker=L.marker([myLat,myLng]).addTo(map).bindPopup("Tú"); });
onSnapshot(collection(db,"choferes"), snap=>{
  const choferes=snap.docs.filter(d=>d.data().aprobado!==false && d.data().disponible!==false); document.getElementById('count').innerText=choferes.length;
  choferes.forEach(doc=>{ const c=doc.data(); if(!c.lat) return; choferesData[doc.id]=c; if(carMarkers[doc.id]) map.removeLayer(carMarkers[doc.id]); const icon=L.divIcon({html:`<div style="transition:all 1s linear"><div style="background:white;border:2px solid #8B5CF6;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.3)">🚗</div><div style="font-size:10px;font-weight:900;background:black;color:white;padding:2px 6px;border-radius:10px;text-align:center;margin-top:2px">${c.nombre?c.nombre.split(' ')[0]:'Chofer'}</div></div>`,iconSize:[44,44],iconAnchor:[22,22]}); const m=L.marker([c.lat,c.lng],{icon}).addTo(map); m.on('click',()=>{ choferSeleccionado=c; document.getElementById('m-foto').src=c.foto||'https://i.pravatar.cc/150?u='+c.id; document.getElementById('m-nombre').innerText=c.nombre||'Chofer VIP'; document.getElementById('m-auto').innerText=(c.auto||'')+' '+(c.placas||''); document.getElementById('m-dist').innerText=`A ${(map.distance([myLat,myLng],[c.lat,c.lng])/1000).toFixed(1)} km de ti`; const dest=document.getElementById('destino').value||'mi ubicación'; const msg=`Hola ${c.nombre}, soy ${document.getElementById('nombre').value||'Pasajero'}%0AQuiero viaje a: ${dest}%0ADistancia: ${distanciaReal?distanciaReal.toFixed(2)+'km':''}%0ATarifa: $${distanciaReal?calcTarifa(distanciaReal):'35 min'}%0AMi ubic: https://maps.google.com/?q=${myLat},${myLng}`; document.getElementById('m-wsp').href=`https://wa.me/52${c.id}?text=${msg}`; document.getElementById('modal-chofer').classList.remove('hidden'); }); carMarkers[doc.id]=m; });
});
document.getElementById('cerrar-modal').onclick=()=>document.getElementById('modal-chofer').classList.add('hidden');
document.getElementById('m-solicitar-app').onclick=()=>{ document.getElementById('modal-chofer').classList.add('hidden'); document.getElementById('solicitar').click(); };
document.getElementById('solicitar').onclick=async()=>{ const info=await calcularRutaReal(); if(!info){ alert('Escribe dirección exacta en Mazatlán: Ej. Av Camaron Sabalo 500, Cobaes 36'); return; } const cliente=document.getElementById('nombre').value||'Pasajero', tel=document.getElementById('tel').value, destino=document.getElementById('destino').value; const ref=await addDoc(collection(db,"viajes"),{cliente,destino,telefono:tel,km:info.km,tarifa_final:info.tarifa,lat:myLat,lng:myLng,dest_lat:destLat,dest_lng:destLng,dest_display:info.dest.display,ruta:info.ruta,chofer_solicitado:choferSeleccionado?choferSeleccionado.id:null,estado:'buscando',fecha:serverTimestamp()}); document.getElementById('status').innerText=`✅ Ruta real ${info.km.toFixed(2)}km = $${info.tarifa} - Choferes te ven`; if(choferSeleccionado) window.open(document.getElementById('m-wsp').href,'_blank'); };
</script>
</body>
</html>
