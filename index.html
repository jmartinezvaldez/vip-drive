<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIPDRIVE - Ruta Real</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>#map{height:100vh;width:100%} .bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:white;border-radius:28px 28px 0 0;z-index:1000;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}</style>
</head>
<body>
<div id="map"></div>
<button id="ubicar" class="fixed bottom-[280px] right-4 z-[1000] w-14 h-14 bg-white rounded-full shadow-xl flex items-center justify-center">🎯</button>

<div class="bottom-sheet">
<div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-4"></div>
<h1 class="text-[22px] font-black text-black">¿A dónde vas, Pasajero?</h1>

<div class="mt-3 bg-gray-100 rounded-2xl flex items-center px-4 py-3">
<span>🔍</span>
<input id="destino" class="flex-1 bg-transparent outline-none ml-3 text-black font-bold" value="Monumento al Pescador" placeholder="Ej: Gran Acuario, Cobaes 36">
<button id="clear" class="w-8 h-8 bg-gray-200 rounded-full">X</button>
</div>

<div id="detalle" class="mt-4 border-t pt-3">
<p class="text-xs font-black text-gray-500">DETALLE DEL VIAJE</p>
<p class="text-sm text-black mt-2">Distancia real: <b id="dist-real">-- km</b> • Ruta: <b id="ruta-info">--</b></p>
<p class="text-lg font-black text-black">Tarifa: <b id="tarifa-final" class="text-purple-600">$35 mínimo</b></p>
<p class="text-xs text-gray-500">$10 por km • Mínimo $35 para viajes cortos</p>
<div class="flex gap-2 mt-3">
<input id="nombre" placeholder="Tu nombre" class="flex-1 p-3 bg-gray-100 rounded-xl text-sm text-black">
<input id="tel" placeholder="WhatsApp" class="flex-1 p-3 bg-gray-100 rounded-xl text-sm text-black">
</div>
<button id="solicitar" class="w-full mt-3 bg-black text-white py-4 rounded-full font-black text-lg">CALCULAR RUTA Y SOLICITAR</button>
<p id="status" class="text-xs text-center mt-2 text-green-600"></p>
<div id="viaje-vivo" class="hidden mt-2 bg-purple-50 border border-purple-200 rounded-xl p-3"><p id="km-cliente" class="text-black text-sm"></p><p id="tarifa-cliente" class="text-black font-black text-lg"></p></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDfpRv7mrAkTyETSYqmOTebVHokrbP_o2M", authDomain: "vip-drive-f19c1.firebaseapp.com", projectId: "vip-drive-f19c1", storageBucket: "vip-drive-f19c1.firebasestorage.app", messagingSenderId: "696888361898", appId: "1:696888361898:web:789595b0782015384521d3" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

let myLat=23.2329, myLng=-106.4062, destLat=23.223, destLng=-106.416, map, myMarker, routeLine, miViajeId=null, distanciaReal=0;
map = L.map('map', {zoomControl:false}).setView([myLat, myLng], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

function calcTarifa(km){ return Math.max(35, Math.round(km*10)); }

async function geocodeDestino(texto){
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(texto + ' Mazatlán Sinaloa')}&limit=1`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.length>0){ return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)}; }
  }catch(e){}
  return null;
}

async function calcularRutaReal(){
  const destinoTexto = document.getElementById('destino').value;
  if(!destinoTexto) return;
  document.getElementById('ruta-info').innerText = 'Calculando...';
  
  let dCoords = await geocodeDestino(destinoTexto);
  if(!dCoords){
    // si no encuentra, usa puntos predefinidos de tu foto
    const puntos = {"Monumento al Pescador":[23.223,-106.416],"Gran Acuario Mazatlán":[23.239,-106.42],"Letras de Mazatlán":[23.246,-106.425],"Malecón de Mazatlán":[23.213,-106.416],"Olas Altas":[23.205,-106.412],"Cerro del Crestón - Faro Mazatlán":[23.19,-106.42],"Walmart":[23.249,-106.41],"Cobaes 36":[23.22,-106.38]};
    for(let k in puntos){ if(destinoTexto.toLowerCase().includes(k.toLowerCase().split(' ')[0])){ dCoords={lat:puntos[k][0], lng:puntos[k][1]}; break; } }
    if(!dCoords) dCoords={lat:23.223, lng:-106.416};
  }
  destLat=dCoords.lat; destLng=dCoords.lng;
  
  try{
    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${myLng},${myLat};${destLng},${destLat}?overview=full&geometries=geojson`;
    const r = await fetch(osrmUrl);
    const j = await r.json();
    if(j.routes && j.routes.length>0){
      distanciaReal = j.routes[0].distance/1000; // km
      const coords = j.routes[0].geometry.coordinates.map(c=>[c[1], c[0]]);
      if(routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(coords, {color:'#8B5CF6', weight:7, opacity:0.9}).addTo(map);
      map.fitBounds(routeLine.getBounds(), {padding:[100,100]});
      
      document.getElementById('dist-real').innerText = distanciaReal.toFixed(2)+' km';
      document.getElementById('ruta-info').innerText = `${(j.routes[0].duration/60).toFixed(0)} min`;
      const tarifa = calcTarifa(distanciaReal);
      document.getElementById('tarifa-final').innerText = `$${tarifa} ${distanciaReal*10<35?'(mín $35)':''}`;
      document.getElementById('solicitar').innerText = `SOLICITAR POR $${tarifa}`;
      return {km: distanciaReal, tarifa: tarifa, ruta: coords};
    }
  }catch(e){
    console.log(e);
  }
  document.getElementById('ruta-info').innerText='Ruta estimada';
  return null;
}

document.getElementById('destino').addEventListener('change', calcularRutaReal);
document.getElementById('destino').addEventListener('blur', calcularRutaReal);
document.getElementById('clear').onclick=()=>{ document.getElementById('destino').value=''; };
document.getElementById('ubicar').onclick=()=>{ navigator.geolocation.getCurrentPosition(p=>{ myLat=p.coords.latitude; myLng=p.coords.longitude; map.setView([myLat,myLng],15); calcularRutaReal(); }); };

navigator.geolocation.getCurrentPosition(p=>{ myLat=p.coords.latitude; myLng=p.coords.longitude; map.setView([myLat,myLng],14); L.marker([myLat,myLng]).addTo(map).bindPopup("Tú"); calcularRutaReal(); }, ()=>{ calcularRutaReal(); });

document.getElementById('solicitar').onclick=async()=>{
  const infoRuta = await calcularRutaReal();
  if(!infoRuta){ alert('No se pudo calcular ruta, intenta otro destino'); return; }
  const cliente=document.getElementById('nombre').value||'Pasajero', tel=document.getElementById('tel').value, destino=document.getElementById('destino').value;
  const ref = await addDoc(collection(db, "viajes"), { cliente, destino, telefono: tel, km: infoRuta.km, tarifa_final: infoRuta.tarifa, tarifa_por_km:10, tarifa_minima:35, lat: myLat, lng: myLng, dest_lat: destLat, dest_lng: destLng, ruta: infoRuta.ruta, estado:'buscando', fecha: serverTimestamp() });
  miViajeId=ref.id; document.getElementById('status').innerText=`✅ Solicitado: ${infoRuta.km.toFixed(2)}km = $${infoRuta.tarifa}`;
};

onSnapshot(collection(db, "viajes"), snap=>{
  snap.docs.forEach(d=>{
    const v=d.data(); if(miViajeId && d.id===miViajeId && v.km){
      document.getElementById('viaje-vivo').classList.remove('hidden');
      document.getElementById('km-cliente').innerText=`Recorrido: ${v.km.toFixed(2)} km`;
      document.getElementById('tarifa-cliente').innerText=`$${calcTarifa(v.km)}`;
      if(v.estado==='finalizado'){ document.getElementById('status').innerText=`Finalizado: $${v.tarifa_final} por ${v.km.toFixed(2)}km`; }
    }
  });
});
</script>
</body>
</html>
