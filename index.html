<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIPDRIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{margin:0;background:#111;color:white}#map{height:55vh;background:#222} .sheet{background:white;border-radius:28px 28px 0 0;padding:20px;color:black;min-height:45vh}</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div class="p-3 bg-black text-white flex justify-between"><b>VIPDRIVE MAZATLÁN</b><span id="count">0 choferes</span></div>
<div id="map"></div>
<div class="sheet">
<h1 class="font-black text-xl">¿A dónde vas? Toca el mapa</h1>
<p class="text-xs text-gray-500">Esta versión abre con datos móviles - toca donde quieres ir</p>
<input id="destino" class="w-full mt-3 bg-gray-100 p-3 rounded-xl text-black font-bold" placeholder="Ej: Av Camaron Sabalo 500">
<p class="mt-3">Distancia: <b id="km">-- km</b> | Tarifa: <b id="tarifa">$35 mínimo</b> ($10/km)</p>
<input id="nombre" placeholder="Tu nombre" class="w-full mt-2 p-3 bg-gray-100 rounded-xl">
<input id="tel" placeholder="WhatsApp" class="w-full mt-2 p-3 bg-gray-100 rounded-xl">
<button id="btn" class="w-full mt-3 bg-black text-white py-4 rounded-full font-black">SOLICITAR POR $35</button>
<p id="status" class="text-center text-green-600 font-bold mt-2"></p>
<p class="text-xs text-center mt-2">Si no carga mapa, igual funciona tocando aquí arriba y solicitando</p>
</div>
<script type="module">
try{
const map = L.map('map').setView([23.2329, -106.4062], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let myLat=23.2329, myLng=-106.4062, destLat=null, destLng=null, kmReal=0, routeLine=null, carMarkers={};
function calcTarifa(k){ return Math.max(35, Math.round(k*10)); }
function distancia(lat1,lon1,lat2,lon2){ const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))*1.35; }
navigator.geolocation.getCurrentPosition(p=>{ myLat=p.coords.latitude; myLng=p.coords.longitude; map.setView([myLat,myLng],15); L.marker([myLat,myLng]).addTo(map).bindPopup("Tú").openPopup(); }, ()=>{});
map.on('click', e=>{ destLat=e.latlng.lat; destLng=e.latlng.lng; document.getElementById('destino').value=`Destino ${destLat.toFixed(4)},${destLng.toFixed(4)}`; kmReal=distancia(myLat,myLng,destLat,destLng); if(routeLine) map.removeLayer(routeLine); routeLine=L.polyline([[myLat,myLng],[destLat,destLng]],{color:'#8B5CF6',weight:6}).addTo(map); document.getElementById('km').innerText=kmReal.toFixed(2)+' km'; document.getElementById('tarifa').innerText='$'+calcTarifa(kmReal); document.getElementById('btn').innerText=`SOLICITAR POR $${calcTarifa(kmReal)}`; });
document.getElementById('destino').addEventListener('change', async ()=>{ const txt=document.getElementById('destino').value; if(txt.length<3) return; try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(txt+' Mazatlán')}`); const d=await r.json(); if(d.length>0){ destLat=parseFloat(d[0].lat); destLng=parseFloat(d[0].lon); kmReal=distancia(myLat,myLng,destLat,destLng); if(routeLine) map.removeLayer(routeLine); routeLine=L.polyline([[myLat,myLng],[destLat,destLng]],{color:'#8B5CF6',weight:6}).addTo(map); map.fitBounds(routeLine.getBounds()); document.getElementById('km').innerText=kmReal.toFixed(2)+' km'; document.getElementById('tarifa').innerText='$'+calcTarifa(kmReal); } }catch(e){} });
document.getElementById('btn').onclick=async()=>{
  if(!destLat){ alert('Primero toca el mapa donde quieres ir'); return; }
  document.getElementById('status').innerText='Enviando...';
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getFirestore, collection, addDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const firebaseConfig = { apiKey: "AIzaSyDfpRv7mrAkTyETSYqmOTebVHokrbP_o2M", authDomain: "vip-drive-f19c1.firebaseapp.com", projectId: "vip-drive-f19c1", storageBucket: "vip-drive-f19c1.firebasestorage.app", messagingSenderId: "696888361898", appId: "1:696888361898:web:789595b0782015384521d3" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    await addDoc(collection(db,"viajes"),{cliente:document.getElementById('nombre').value||'Pasajero', destino:document.getElementById('destino').value, telefono:document.getElementById('tel').value, km:kmReal, tarifa_final:calcTarifa(kmReal), lat:myLat, lng:myLng, dest_lat:destLat, dest_lng:destLng, estado:'buscando', fecha:serverTimestamp()});
    document.getElementById('status').innerText=`✅ Solicitado ${kmReal.toFixed(2)}km = $${calcTarifa(kmReal)}`;
  }catch(e){ document.getElementById('status').innerText='Error con datos, pero tarifa es $'+calcTarifa(kmReal)+' - Intenta con WiFi para enviar'; console.log(e); }
};
// Choferes - carga después para no bloquear
setTimeout(async ()=>{
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getFirestore, collection, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const firebaseConfig = { apiKey: "AIzaSyDfpRv7mrAkTyETSYqmOTebVHokrbP_o2M", authDomain: "vip-drive-f19c1.firebaseapp.com", projectId: "vip-drive-f19c1", storageBucket: "vip-drive-f19c1.firebasestorage.app", messagingSenderId: "696888361898", appId: "1:696888361898:web:789595b0782015384521d3" };
    const app2 = initializeApp(firebaseConfig, 'c2'); const db2 = getFirestore(app2);
    onSnapshot(collection(db2,"choferes"), snap=>{
      document.getElementById('count').innerText=snap.size+' choferes';
      snap.forEach(doc=>{ const c=doc.data(); if(!c.lat) return; if(carMarkers[doc.id]) map.removeLayer(carMarkers[doc.id]); const icon=L.divIcon({html:`<div style="background:white;border:2px solid #8B5CF6;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center">🚗</div>`,iconSize:[38,38]}); carMarkers[doc.id]=L.marker([c.lat,c.lng],{icon}).addTo(map).bindPopup(`<b>${c.nombre||'Chofer'}</b><br><a href='https://wa.me/52${c.id}' target='_blank'>WhatsApp</a>`); });
    });
  }catch(e){}
}, 1000);
}catch(err){ document.body.innerHTML='<div style="padding:20px;background:white;color:black"><h1>VIPDRIVE</h1><p>Error cargando mapa con datos móviles, pero puedes solicitar:</p><p>Tarifa $10/km Min $35</p><p>Error: '+err.message+'</p><a href="https://jmartinezvaldez.github.io/vip-drive/?v=4">Recargar</a></div>'; }
</script>
</body>
</html>
